name: Travalon bot

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: travalon

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Buscar menciones nuevas
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python travalon_check.py

      - name: Guardar lo ya visto
        run: |
          git config user.name "travalon-bot"
          git config user.email "travalon-bot@users.noreply.github.com"
          git add travalon_seen.json
          git diff --staged --quiet || (git commit -m "actualizar vistos" && git push)
